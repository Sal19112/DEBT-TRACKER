<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Debt Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --bg4: #222736;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555b6e;
    --red: #e05c5c;
    --red-bg: rgba(224,92,92,0.1);
    --green: #4caf82;
    --green-bg: rgba(76,175,130,0.1);
    --blue: #5b8dee;
    --blue-bg: rgba(91,141,238,0.1);
    --amber: #e8a838;
    --amber-bg: rgba(232,168,56,0.1);
    --purple: #9b72ef;
    --purple-bg: rgba(155,114,239,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; }
  a { color: inherit; text-decoration: none; }

  /* ── Layout ── */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--bg2);
    border-right: 1px solid var(--border); padding: 24px 16px;
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .main { flex: 1; padding: 32px 36px; max-width: 1100px; overflow-x: hidden; }
  @media(max-width:700px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
    .main{padding:16px}
    .sidebar .logo{width:100%;margin-bottom:4px}
  }

  /* ── Sidebar ── */
  .logo { font-size: 16px; font-weight: 600; color: var(--text); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 28px; height: 28px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .nav-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; padding: 4px 12px; margin-top: 8px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--text2); font-size: 13px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all .15s;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--text); }
  .nav-btn.active { background: var(--blue-bg); color: var(--blue); }
  .nav-btn .icon { font-size: 16px; width: 18px; text-align: center; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
  .sync-status { font-size: 11px; color: var(--text3); padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }
  .sync-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Header ── */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
  .page-title { font-size: 22px; font-weight: 600; color: var(--text); }
  .page-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .btn:hover { background: var(--bg4); border-color: var(--border2); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #4a7de0; }
  .btn.danger { background: var(--red-bg); border-color: rgba(224,92,92,.3); color: var(--red); }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Summary cards ── */
  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 28px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .metric-value.red { color: var(--red); }
  .metric-value.green { color: var(--green); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── Table / list ── */
  .section-head { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 12px 16px; text-align: left; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg3); }
  td { padding: 14px 16px; color: var(--text); font-size: 13px; vertical-align: middle; }
  .cell-name { font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .av-company { background: var(--blue-bg); color: var(--blue); }
  .av-friend { background: var(--green-bg); color: var(--green); }
  .av-family { background: var(--amber-bg); color: var(--amber); }
  .av-other { background: var(--purple-bg); color: var(--purple); }
  .badge { display: inline-flex; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-company { background: var(--blue-bg); color: var(--blue); }
  .badge-friend { background: var(--green-bg); color: var(--green); }
  .badge-family { background: var(--amber-bg); color: var(--amber); }
  .badge-other { background: var(--purple-bg); color: var(--purple); }
  .badge-done { background: var(--green-bg); color: var(--green); }
  .cell-mono { font-family: 'DM Mono', monospace; font-size: 13px; }
  .cell-red { color: var(--red); font-weight: 500; font-family: 'DM Mono', monospace; }
  .cell-green { color: var(--green); font-weight: 500; font-family: 'DM Mono', monospace; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; min-width: 60px; }
  .progress-fill { height: 100%; border-radius: 2px; background: var(--red); transition: width .3s; }
  .progress-fill.done { background: var(--green); }
  .progress-pct { font-size: 11px; color: var(--text3); min-width: 32px; text-align: right; font-family: 'DM Mono', monospace; }

  /* ── Detail drawer ── */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; }
  .drawer-overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: -520px; bottom: 0; width: 500px; max-width: 96vw;
    background: var(--bg2); border-left: 1px solid var(--border2); z-index: 101;
    overflow-y: auto; padding: 28px; transition: right .25s cubic-bezier(.4,0,.2,1);
  }
  .drawer.open { right: 0; }
  .drawer-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .drawer-name { font-size: 20px; font-weight: 600; }
  .drawer-close { background: none; border: 1px solid var(--border2); color: var(--text2); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .drawer-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .d-stat { background: var(--bg3); border-radius: var(--radius-sm); padding: 14px; }
  .d-stat .label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
  .d-stat .val { font-size: 18px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .d-stat .val.red { color: var(--red); }
  .d-stat .val.green { color: var(--green); }
  .payments-section { margin-top: 16px; }
  .ps-head { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .payment-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .payment-row:last-child { border-bottom: none; }
  .payment-date { font-size: 12px; color: var(--text2); }
  .payment-amt { font-family: 'DM Mono', monospace; color: var(--green); font-weight: 500; }
  .payment-bal { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .payment-note { font-size: 11px; color: var(--text3); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-pay { text-align: center; padding: 28px; color: var(--text3); font-size: 13px; }

  /* ── Modals ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 28px; width: 460px; max-width: 95vw; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid.single { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; }
  .field input, .field select, .field textarea {
    background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
  .field select option { background: var(--bg3); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .setup-note { background: var(--amber-bg); border: 1px solid rgba(232,168,56,.3); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 16px; font-size: 12px; color: var(--amber); line-height: 1.6; }
  .setup-note a { text-decoration: underline; }
  .setup-note code { font-family: 'DM Mono', monospace; background: rgba(232,168,56,.15); padding: 1px 5px; border-radius: 4px; }

  /* ── Config screen / cards ── */
  .config-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-top: 16px; max-width: 560px; }
  .config-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
  .config-card p { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
  .config-steps { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }
  .step { display: flex; gap: 12px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--blue-bg); color: var(--blue); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .step-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .step-text code { font-family: 'DM Mono', monospace; background: var(--bg4); padding: 1px 6px; border-radius: 4px; color: var(--text); font-size: 12px; }
  .step-text strong { color: var(--text); }

  /* ── Loading / empty ── */
  .loading { display: flex; align-items: center; gap: 10px; color: var(--text3); font-size: 13px; padding: 32px 0; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 48px 24px; color: var(--text3); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 13px; z-index: 300; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: rgba(76,175,130,.4); color: var(--green); }
  .toast.err { border-color: rgba(224,92,92,.4); color: var(--red); }

  /* ── View pages ── */
  .view { display: none; }
  .view.active { display: block; }

  /* Apps script banner */
  .banner { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; font-size: 13px; color: var(--text2); display: flex; gap: 12px; align-items: flex-start; }
  .banner-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">💳</div>
      DebtTracker
    </div>
    <div class="nav-label">Navigation</div>
    <button class="nav-btn active" onclick="showView('dashboard', this)">
      <span class="icon">📊</span> Dashboard
    </button>
    <button class="nav-btn" onclick="showView('debts', this)">
      <span class="icon">📋</span> All Debts
    </button>
    <button class="nav-btn" onclick="showView('payments', this)">
      <span class="icon">💸</span> Payments
    </button>
    <div class="sidebar-divider"></div>
    <div class="nav-label">Actions</div>
    <button class="nav-btn" onclick="openAddDebt()">
      <span class="icon">➕</span> Add Debt
    </button>
    <button class="nav-btn" onclick="openAddPayment()">
      <span class="icon">✅</span> Record Payment
    </button>
    <div class="sidebar-divider"></div>
    <button class="nav-btn" onclick="showView('settings', this)">
      <span class="icon">⚙️</span> Settings
    </button>
    <div class="sidebar-divider"></div>
    <div class="sync-status" id="sync-status">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-text">Not connected</span>
    </div>
    <div style="margin-top:auto;padding-top:12px">
      <button class="nav-btn" onclick="syncFromSheet()" style="color:var(--blue)">
        <span class="icon">🔄</span> Sync from Sheet
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="view active" id="view-dashboard">
      <div class="page-header">
        <div>
          <div class="page-title">Dashboard</div>
          <div class="page-sub">Overview of all your outstanding debts</div>
        </div>
        <div class="btn-group">
          <button class="btn" onclick="syncFromSheet()">🔄 Sync</button>
          <button class="btn primary" onclick="openAddDebt()">+ Add Debt</button
