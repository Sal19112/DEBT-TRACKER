<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Debt Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e28;
    --bg4: #222736;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555b6e;
    --red: #e05c5c;
    --red-bg: rgba(224,92,92,0.1);
    --green: #4caf82;
    --green-bg: rgba(76,175,130,0.1);
    --blue: #5b8dee;
    --blue-bg: rgba(91,141,238,0.1);
    --amber: #e8a838;
    --amber-bg: rgba(232,168,56,0.1);
    --purple: #9b72ef;
    --purple-bg: rgba(155,114,239,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; }
  a { color: inherit; text-decoration: none; }

  /* ── Layout ── */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--bg2);
    border-right: 1px solid var(--border); padding: 24px 16px;
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .main { flex: 1; padding: 32px 36px; max-width: 1100px; overflow-x: hidden; }
  @media(max-width:700px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px;gap:4px}
    .main{padding:16px}
    .sidebar .logo{width:100%;margin-bottom:4px}
  }

  /* ── Sidebar ── */
  .logo { font-size: 16px; font-weight: 600; color: var(--text); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 28px; height: 28px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .nav-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; padding: 4px 12px; margin-top: 8px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--text2); font-size: 13px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all .15s;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--text); }
  .nav-btn.active { background: var(--blue-bg); color: var(--blue); }
  .nav-btn .icon { font-size: 16px; width: 18px; text-align: center; }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
  .sync-status { font-size: 11px; color: var(--text3); padding: 8px 12px; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }
  .sync-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Header ── */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
  .page-title { font-size: 22px; font-weight: 600; color: var(--text); }
  .page-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .btn:hover { background: var(--bg4); border-color: var(--border2); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #4a7de0; }
  .btn.danger { background: var(--red-bg); border-color: rgba(224,92,92,.3); color: var(--red); }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Summary cards ── */
  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 28px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .metric-value.red { color: var(--red); }
  .metric-value.green { color: var(--green); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* ── Table / list ── */
  .section-head { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--
